<!doctype html>
<!--
  ONA 2.0 — OWNER PANEL (step 3). One file, no install.
  Log in with the owner account from Supabase, or click "Try the demo".
  Edit CONFIG below, then rebuild with:  python build_panel.py
  Source: panel/src/  (css, i18n.js, demo.js, app.js)
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#35294D">
<title>MALVA · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#F3EADB; --sand:#E8D8C0; --sand-2:#DCC7A8; --paper:#FFFBF4;
  --clay:#B5532F; --clay-d:#963F20; --clay-soft:#F6DCCF;
  --olive:#56603F; --olive-d:#3A4129; --olive-soft:#E3E6D3;
  --ink:#2A2019; --ink-2:#6B5B4C; --ink-3:#9A8A79; --line:#E2D4BE;
  --sun:#E9A94B; --sun-soft:#F8E6C4; --ok:#3F7A4A; --ok-soft:#DCEBDD; --bad:#A8402A;
  --r:14px; --ease:cubic-bezier(.2,.7,.2,1);
  --side:236px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--lime);color:var(--ink);font:400 15px/1.5 Onest,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:6px}
.serif{font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100;font-weight:380;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons, inputs, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;transition:background .2s,transform .15s,box-shadow .2s;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}
.btn-clay{background:var(--clay);color:#fff;box-shadow:none}.btn-clay:hover{background:var(--clay-d)}
.btn-ink{background:var(--ink);color:var(--lime);box-shadow:none}.btn-ink:hover{background:#000}
.btn-olive{background:var(--olive);color:#fff;box-shadow:none}.btn-olive:hover{background:var(--olive-d)}
.btn-ghost{background:transparent;box-shadow:none}.btn-ghost:hover{background:var(--sand)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%}
.btn-danger{color:var(--bad)}
.fld{display:grid;gap:5px}
.fld label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:10px 12px;font-size:15px;transition:border-color .2s}
.inp:focus{outline:0;border-color:var(--olive)}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sand);color:var(--olive-d);white-space:nowrap;line-height:1.6}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--clay-soft);color:var(--clay-d)}
.chip.sun{background:var(--sun-soft);color:#8A5A12}
.chip.ink{background:var(--ink);color:var(--lime)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.seg{display:inline-flex;background:var(--sand);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(42,32,25,.15)}
.toggle{position:relative;width:44px;height:26px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:relative;z-index:1}
.toggle span{position:absolute;inset:0;background:var(--sand-2);border-radius:999px;transition:background .2s}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--olive)}
.toggle input:checked+span::after{transform:translateX(18px)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;color:#fff}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#F2C27A55,transparent 40%),var(--lime)}
.login-card{width:min(420px,100%);background:var(--paper);border-radius:22px;padding:34px 30px;box-shadow:0 30px 60px -30px rgba(42,32,25,.4)}
.login-card h1{font-size:36px;margin:18px 0 6px;line-height:1.05}
.login-card form{display:grid;gap:14px;margin-top:24px}
.login-err{background:var(--clay-soft);color:var(--clay-d);border-radius:10px;padding:10px 12px;font-size:14px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo svg{width:32px;height:32px}
.logo b{font-family:Fraunces,serif;font-weight:450;font-size:24px;letter-spacing:.06em}
.logo small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-top:-2px}
.lang{display:inline-flex;background:var(--sand);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--olive-d);color:var(--sand);display:flex;flex-direction:column;padding:22px 14px}
.side .logo b{color:var(--lime)}.side .logo small{color:var(--sand-2)}
.nav{display:grid;gap:3px;margin-top:30px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--sand);padding:11px 12px;border-radius:11px;font-weight:500;font-size:14.5px;text-align:left;transition:background .2s}
.nav button svg{width:20px;height:20px;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--lime);color:var(--ink)}
.nav button[aria-current="page"] svg{opacity:1;stroke:var(--clay)}
.side-foot{margin-top:auto;display:grid;gap:12px;font-size:13px}
.side-foot .lang{background:rgba(255,255,255,.1)}
.side-foot .lang button{color:var(--sand)}
.side-foot .lang button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}
.side-foot .who{color:var(--sand-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .btn{background:rgba(255,255,255,.08);color:var(--lime);box-shadow:none}
.demo-pill{background:var(--sun);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;justify-self:start}
.main{min-width:0;padding:26px clamp(16px,3vw,40px) 60px}
.topbar{display:none}
.tabs{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--lime) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-bottom:1px solid var(--line)}
  .topbar .logo b{font-size:20px}
  .topbar .sp{flex:1}
  .main{padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);padding:6px 0;border-radius:10px}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-current="page"]{color:var(--clay)}
}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:clamp(30px,4vw,44px);line-height:1;margin:0}
.ph .sub{color:var(--ink-2);margin-top:6px;font-size:14px}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.datenav{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.datenav .btn{box-shadow:none;background:transparent}
.datenav .btn:hover{background:var(--sand)}
.datenav input[type=date],.datenav input[type=month]{border:0;background:transparent;padding:6px 4px;font-size:14px;font-weight:600;width:auto;max-width:150px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--paper);border-radius:var(--r);padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.kpi .k{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.kpi .v{font-family:Fraunces,serif;font-size:32px;line-height:1.1;margin-top:4px;font-variation-settings:"SOFT" 100}
.kpi .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kpi.hero{background:var(--ink);color:var(--lime);box-shadow:none}
.kpi.hero .k,.kpi.hero .d{color:var(--sand-2)}

/* ---------- cards / sessions ---------- */
.card{background:var(--paper);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line)}
.sess-list{display:grid;gap:12px}
.sess{overflow:hidden}
.sess-head{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;padding:14px 16px;width:100%}
.sess-head:focus-visible{outline:2px solid var(--clay);outline-offset:-2px;border-radius:var(--r)}
.sess .time{font-family:Fraunces,serif;font-size:26px;line-height:1}
.sess .time small{display:block;font:500 12px Onest,sans-serif;color:var(--ink-2);margin-top:4px}
.sess .nm{font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sess .meta{font-size:13px;color:var(--ink-2)}
.fill{display:grid;gap:5px;justify-items:end;min-width:120px}
.fill .num{font-weight:600;font-size:14px}
.bar{width:120px;height:6px;border-radius:999px;background:var(--sand);overflow:hidden;display:flex;gap:2px}
.bar i{display:block;height:100%;background:var(--olive);border-radius:999px}
.bar i.over{background:var(--clay)}
.sess.cancelled .sess-head{opacity:.55}
.sess.cancelled .nm span:first-child{text-decoration:line-through}
.sess.now{box-shadow:inset 0 0 0 2px var(--sun)}
@media (max-width:640px){.sess-head{grid-template-columns:60px 1fr;row-gap:8px}.fill{grid-column:1/-1;justify-items:start;grid-template-columns:auto 1fr;align-items:center;gap:10px}.bar{width:100%}.sess .time{font-size:21px}}
.roster{border-top:1px solid var(--line);padding:6px 10px 12px}
.rrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--line)}
.rrow:last-of-type{border-bottom:0}
.rrow .who{min-width:0}
.rrow .who b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .who .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.rrow .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rrow.st-cancelled{opacity:.55}
.rrow.st-cancelled b{text-decoration:line-through}
@media (max-width:640px){.rrow{grid-template-columns:36px 1fr}.rrow .acts{grid-column:1/-1;justify-content:flex-start}}
.check{display:inline-flex;border-radius:999px;background:var(--sand);padding:3px;gap:2px}
.check button{border:0;background:transparent;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.check button svg{width:15px;height:15px}
.check button.on-ok{background:var(--ok);color:#fff}
.check button.on-bad{background:var(--bad);color:#fff}
.pay{border:0;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.pay svg{width:15px;height:15px;flex:none}
.pay.paid{background:var(--ok-soft);color:var(--ok)}
.pay.unpaid{background:var(--clay-soft);color:var(--clay-d)}
.pay.pack{background:var(--olive-soft);color:var(--olive-d)}
.roster-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 6px 2px;border-top:1px solid var(--line);margin-top:6px}
.subhead{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--olive);margin:14px 6px 4px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.empty svg{width:42px;height:42px;stroke:var(--sand-2);margin-bottom:8px}

/* add person */
.addbox{padding:12px 6px;display:grid;gap:10px}
.sugg{display:grid;gap:4px;max-height:220px;overflow:auto}
.sugg button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px}
.sugg button:hover,.sugg button:focus-visible{background:var(--sand)}

/* ---------- week grid ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wday h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline}
.wday h3 b{font-family:Fraunces,serif;font-size:22px;font-weight:400;color:var(--ink)}
.wday.today h3 b{color:var(--clay)}
.wslots{display:grid;gap:6px}
.wslot{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border-radius:11px;padding:9px 10px;box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:3px;transition:box-shadow .2s,transform .15s}
.wslot:hover{box-shadow:inset 0 0 0 1.5px var(--olive)}
.wslot .t{font-weight:700;font-size:13px}
.wslot .n{font-size:13px;line-height:1.25}
.wslot .i{font-size:11.5px;color:var(--ink-2)}
.wslot .bar{width:100%;height:4px;margin-top:3px}
.wslot.full{background:var(--olive-soft)}
.wslot.cancelled{opacity:.5;text-decoration:line-through}
.wslot.past{opacity:.65}
@media (max-width:1100px){.week{grid-template-columns:1fr}.wslots{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--lime)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
@media (max-width:700px){.tbl.cards thead{display:none}.tbl.cards tr{display:grid;grid-template-columns:1fr auto;padding:10px 6px;border-bottom:1px solid var(--line)}.tbl.cards td{border:0;padding:2px 8px}.tbl.cards td.opt{display:none}.tbl.cards td.num{text-align:right}}
.dayblock{margin-bottom:18px}
.dayblock h3{margin:0 0 8px;font-size:15px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{max-width:320px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--lime)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(42,32,25,.4);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--lime);z-index:90;transform:translateX(105%);transition:transform .35s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(42,32,25,.5)}
.drawer.open{transform:none}
@media (max-width:640px){.drawer{top:auto;max-height:94vh;border-radius:20px 20px 0 0;transform:translateY(105%)}}
.dr-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font-size:24px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-body{padding:18px 20px 26px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}
.dr-foot{padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.section{background:var(--paper);border-radius:var(--r);padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.section>h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);display:flex;justify-content:space-between;align-items:center;gap:10px}
.passcard{border-radius:12px;padding:12px 14px;background:var(--olive-soft);display:grid;gap:6px}
.passcard.void{background:var(--sand);opacity:.6}
.passcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{height:8px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden}
.meter i{display:block;height:100%;background:var(--olive);border-radius:999px}
.hist{display:grid;gap:2px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.warn{background:var(--sun-soft);border-radius:12px;padding:10px 12px;font-size:14px;color:#6B4A12}

/* ---------- popover menu ---------- */
.menu{position:fixed;z-index:120;min-width:200px;background:var(--paper);border-radius:14px;box-shadow:0 20px 50px -12px rgba(42,32,25,.45),inset 0 0 0 1px var(--line);padding:6px;display:grid;animation:pop .16s var(--ease)}
.menu button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--sand)}
.menu button svg{width:17px;height:17px;flex:none}
.menu{max-height:calc(100vh - 16px);overflow:auto}
.menu button.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu .mh{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:6px 12px 2px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:640px){.menu{left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom));min-width:0}.menu button{padding:14px}}

/* ---------- chart ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--lime);font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.chart .tip.on{opacity:1}
.hbar{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr 48px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.hbar .track{height:10px;border-radius:999px;background:var(--sand);overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--olive);border-radius:0 4px 4px 0}
.hbar .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.cols2{grid-template-columns:1fr}}
.set-row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .d{font-size:13px;color:var(--ink-2)}
.set-row .inp{width:110px;text-align:right}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,160px);background:var(--ink);color:var(--lime);padding:12px 18px;border-radius:999px;font-size:14px;z-index:200;transition:transform .35s var(--ease);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}
@media (max-width:900px){.toast{bottom:calc(90px + env(safe-area-inset-bottom))}}
.loading{display:grid;gap:12px}
.loading i{display:block;height:78px;border-radius:var(--r);background:linear-gradient(90deg,var(--sand) 0%,var(--paper) 50%,var(--sand) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.fade-in{animation:fin .35s var(--ease) both}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- "new booking from your website" banner (demo bridge) ---------- */
.fresh{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;margin:0 0 18px;padding:16px 18px;border-radius:16px;background:linear-gradient(120deg,var(--paper),var(--sun-soft));
  box-shadow:inset 0 0 0 1.5px var(--sun),0 14px 40px color-mix(in srgb,var(--sun) 40%,transparent);overflow:hidden;animation:freshIn .9s var(--ease) both}
.fresh::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,#fff 70%,transparent) 50%,transparent 70%);transform:translateX(-120%);animation:freshSweep 2.2s .5s var(--ease) 1;pointer-events:none}
.fresh .f-spark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff;background:var(--clay);box-shadow:0 0 0 6px color-mix(in srgb,var(--clay) 18%,transparent)}
.fresh .f-title{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-d);display:flex;gap:8px;align-items:center}
.fresh .f-main{font-size:18px;font-weight:600;margin:2px 0 6px}
.fresh .f-list{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:13.5px;color:var(--ink-2)}
.fresh .f-list li::before{content:"✓";color:var(--ok);margin-right:8px;font-weight:700}
.fresh .f-hint{margin-top:8px;font-size:13px;color:var(--clay-d);font-style:italic}
.fresh .f-actions{display:flex;flex-direction:column;gap:8px}
.chip.new{animation:newPulse 2s ease-in-out infinite}
@keyframes freshIn{from{opacity:0;transform:translateY(-14px) scale(.98)}}
@keyframes freshSweep{to{transform:translateX(120%)}}
@keyframes newPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 40%,transparent)}}
@media (max-width:640px){.fresh{grid-template-columns:1fr;gap:10px}.fresh .f-actions{flex-direction:row}.fresh .f-spark{display:none}}
@media (prefers-reduced-motion:reduce){.fresh,.fresh::after,.chip.new{animation:none}}

/* ---------- studio theme (animated layouts) ---------- */
:root{
  --pearl:#F6F2FD;
  --pearl-2:#ECE5FA;
  --blush:#DCD0F5;
  --blush-2:#C6B5EE;
  --rose:#A68BE0;
  --rose-d:#7F63C4;
  --champ:#F9C9AE;
  --champ-2:#FFE8B8;
  --ink:#35294D;
  --ink-2:#6F6489;
  --line:#E4DCF3;
  --white:#FFFDFF;
  --peach:#F9C9AE;
  --butter:#FFE8B8;
  --pink:#F2A9BE;
  --lime:var(--pearl); --sand:var(--pearl-2); --sand-2:var(--blush); --paper:var(--white);
  --clay:var(--rose-d); --clay-d:color-mix(in srgb,var(--rose-d) 82%,#000); --clay-soft:var(--blush);
  --olive:var(--rose); --olive-d:var(--ink); --olive-soft:var(--pearl-2);
  --ink-3:color-mix(in srgb,var(--ink-2) 65%,var(--pearl)); --sun:var(--champ); --sun-soft:var(--champ-2);
}

/* =====================================================================

var CONFIGURED = !!(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey);

function base(){ return CONFIG.supabaseUrl.replace(/\/$/,""); }
function apiError(code, msg){ var e=new Error(msg||code); e.code=code; return e; }

var Auth = {
  signIn: function(email,password){
    return fetch(base()+"/auth/v1/token?grant_type=password",{ method:"POST", headers:{ apikey:CONFIG.supabaseAnonKey, "Content-Type":"application/json" }, body:JSON.stringify({ email:email, password:password }) })
      .then(function(r){ return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok) throw apiError(r.status===400||r.status===401 ? "BAD_LOGIN" : "NETWORK", j.error_description||j.msg);
        session={ access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now()+(j.expires_in||3600)*1000, email:(j.user&&j.user.email)||email };
        LS.set("session",session); return session; }); }, function(){ throw apiError("NETWORK"); });
  },
  refresh: function(){
    if(!session||!session.refresh_token) return Promise.reject(apiError("SESSION_EXPIRED"));
    return fetch(base()+"/auth/v1/token?grant_type=refresh_token",{ method:"POST", headers:{ apikey:CONFIG.supabaseAnonKey, "Content-Type":"application/json" }, body:JSON.stringify({ refresh_token:session.refresh_token }) })
      .then(function(r){ return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok) throw apiError("SESSION_EXPIRED");
        session.access_token=j.access_token; session.refresh_token=j.refresh_token||session.refresh_token; session.expires_at=Date.now()+(j.expires_in||3600)*1000;
        LS.set("session",session); return session; }); });
  },
  signOut: function(){
    var s=session; session=null; LS.del("session");
    if(s&&CONFIGURED) fetch(base()+"/auth/v1/logout",{ method:"POST", headers:{ apikey:CONFIG.supabaseAnonKey, Authorization:"Bearer "+s.access_token } }).catch(function(){});
  }
};
function liveRpc(fn,args,retried){
  var go = (session && session.expires_at-Date.now() < 60000) ? Auth.refresh() : Promise.resolve();
  return go.then(function(){
    return fetch(base()+"/rest/v1/rpc/"+fn,{ method:"POST", headers:{ apikey:CONFIG.supabaseAnonKey, Authorization:"Bearer "+session.access_token, "Content-Type":"application/json" }, body:JSON.stringify(args||{}) });
  }).then(function(r){
    return r.text().then(function(txt){
      var j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){}
      if(r.ok) return j;
      var msg=(j&&(j.message||j.msg))||"";
      if((r.status===401 || /JWT/i.test(msg)) && !retried) return Auth.refresh().then(function(){ return liveRpc(fn,args,true); });
      if(r.status===401) throw apiError("SESSION_EXPIRED");
      throw apiError(/^[A-Z_]+$/.test(msg)?msg:"SERVER", msg);
    });
  }, function(e){ throw e.code?e:apiError("NETWORK"); });
}

var menuEl=null;

function openMenu(anchor, items){
  closeMenu();
  menuEl=document.createElement("div"); menuEl.className="menu"; menuEl.setAttribute("role","menu");
  menuEl.innerHTML=items.map(function(it,i){
    if(it==="-") return "<hr>";
    if(it.head) return '<div class="mh">'+esc(it.head)+'</div>';
    return '<button type="button" role="menuitem" data-i="'+i+'" class="'+(it.danger?"danger":"")+'">'+(it.icon||"")+esc(it.label)+'</button>';
  }).join("");
  document.body.appendChild(menuEl);
  var r=anchor.getBoundingClientRect(), mw=menuEl.offsetWidth, mh=menuEl.offsetHeight;
  var left=Math.min(Math.max(8,r.right-mw), window.innerWidth-mw-8), top=r.bottom+6; if(top+mh>window.innerHeight-8) top=Math.max(8,r.top-mh-6);
  menuEl.style.left=left+"px"; menuEl.style.top=top+"px";
  menuEl.addEventListener("click",function(e){ var b=e.target.closest("[data-i]"); if(!b) return; var it=items[+b.dataset.i]; closeMenu(); it.run(); });
  var first=menuEl.querySelector("button"); if(first) first.focus();
}

function viewWeek(silent){
  var m=document.getElementById("main");
  var head='<div class="ph"><div><h1 class="serif">'+esc(t("nav.week"))+'</h1><div class="sub">'+esc(S.weekTab==="week"?fmtDate(S.weekFrom,{day:"numeric",month:"long"})+" – "+fmtDate(addDays(S.weekFrom,6),{day:"numeric",month:"long",year:"numeric"}):t("tpl.sub"))+'</div></div>'+
    '<div class="actions"><span class="seg" role="group"><button type="button" data-wtab="week" aria-pressed="'+(S.weekTab==="week")+'">'+esc(t("week.calendar"))+'</button><button type="button" data-wtab="tpl" aria-pressed="'+(S.weekTab==="tpl")+'">'+esc(t("week.template"))+'</button></span>'+
    (S.weekTab==="week"
      ? '<span class="datenav"><button class="btn btn-icon" type="button" data-weeknav="-7" aria-label="'+esc(t("prev"))+'">'+I.left+'</button><button class="btn btn-sm" type="button" data-weeknav="0">'+esc(t("thisWeek"))+'</button><button class="btn btn-icon" type="button" data-weeknav="7" aria-label="'+esc(t("next"))+'">'+I.right+'</button></span><button class="btn btn-clay" type="button" data-extra>'+I.plus+esc(t("week.extra"))+'</button>'
      : '<button class="btn btn-clay" type="button" data-tpladd>'+I.plus+esc(t("tpl.add"))+'</button>')+
    '</div></div>';
  if(S.weekTab==="tpl"){
    return rpc("admin_templates").then(function(list){
      if(S.view!=="week"||S.weekTab!=="tpl") return; S.cache.tpl=list;
      var html='';
      for(var d=1;d<=7;d++){ var rows=list.filter(function(x){return x.weekday===d}); if(!rows.length&&d===7) continue;
        html+='<div class="card dayblock" style="padding:6px 16px"><h3 style="padding-top:10px">'+esc(t("dow."+d))+' <span class="muted tiny">'+esc(t("tpl.nClasses",{n:rows.length}))+'</span></h3>'+
          (rows.length?'<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>'+esc(t("f.time"))+'</th><th>'+esc(t("f.class"))+'</th><th class="opt">'+esc(t("f.instructor"))+'</th><th class="opt">'+esc(t("f.level"))+'</th><th class="num">'+esc(t("f.capacity"))+'</th><th></th></tr></thead><tbody>'+
          rows.map(function(x){ return '<tr class="click" data-tpledit="'+x.id+'"'+(x.active?'':' style="opacity:.5"')+'><td><b>'+esc(x.start_time)+'</b></td><td>'+esc(cname(x))+(x.active?'':' <span class="chip line">'+esc(t("paused"))+'</span>')+'</td><td class="opt">'+esc(x.instructor||"—")+'</td><td class="opt">'+esc(t("lvl."+x.level))+'</td><td class="num">'+(x.capacity||x.default_capacity)+'</td><td class="num">'+I.edit+'</td></tr>'; }).join("")+
          '</tbody></table></div>':'<p class="muted tiny">'+esc(t("tpl.none"))+'</p>')+'</div>';
      }
      m.innerHTML='<div class="fade-in">'+head+'<div class="warn" style="margin-bottom:14px">'+esc(t("tpl.explain"))+'</div>'+html+'</div>';
    }, fail);
  }
  var from=S.weekFrom;
  return rpc("admin_week",{ p_from:from }).then(function(list){
    if(S.view!=="week"||S.weekTab!=="week"||S.weekFrom!==from) return; S.cache.week=list;
    var cols="", tk=todayKey(), now=Date.now();
    for(var i=0;i<7;i++){ var k=addDays(from,i), rows=list.filter(function(s){return keyOf(s.starts_at)===k});
      if(!rows.length&&i===6) continue;
      cols+='<section class="wday'+(k===tk?" today":"")+'"><h3><span>'+esc(fmtDate(k,{weekday:"short"}))+'</span><b>'+fmtDate(k,{day:"numeric"})+'</b></h3><div class="wslots">'+
        (rows.length?rows.map(function(s){ var full=s.booked>=s.capacity;
          return '<button type="button" class="wslot'+(s.status==="cancelled"?" cancelled":"")+(full?" full":"")+(Date.parse(s.ends_at)<now?" past":"")+'" data-wsess="'+s.id+'"><span class="t">'+timeOf(s.starts_at)+'</span><span class="n">'+esc(cname(s))+'</span><span class="i">'+esc(s.instructor||"—")+' · '+s.booked+'/'+s.capacity+(s.waitlist?' +'+s.waitlist:'')+'</span>'+bar(s.booked,s.capacity)+'</button>'; }).join("")
          :'<p class="muted tiny" style="margin:0">'+esc(t("week.noClasses"))+'</p>')+'</div></section>';
    }
    var taken=0,cap=0,wait=0; list.forEach(function(s){ if(s.status==="scheduled"){ taken+=s.booked; cap+=s.capacity; wait+=s.waitlist; } });
    m.innerHTML='<div class="fade-in">'+head+'<div class="kpis">'+kpi(t("k.classes"),list.filter(function(s){return s.status==="scheduled"}).length)+kpi(t("k.booked"),taken+" / "+cap,t("k.fillPct",{n:pct(taken,cap)}))+kpi(t("k.waitlist"),wait)+'</div><div class="week">'+cols+'</div></div>';
  }, function(e){ fail(e); });
}

function drawClients(){
  var list=S.cache.clients||[], q=S.clientQ.trim().toLowerCase(), qd=q.replace(/\D/g,""), now=Date.now(), monthStart=todayKey().slice(0,7);
  list=list.filter(function(c){
    if(q && !(c.full_name.toLowerCase().indexOf(q)>=0 || (c.email||"").toLowerCase().indexOf(q)>=0 || (qd && (c.phone||"").replace(/\D/g,"").indexOf(qd)>=0))) return false;
    switch(S.clientFilter){
      case "pass": return !!c.pass;
      case "unpaid": return c.unpaid_cents>0;
      case "inactive": return c.visits>0 && !c.next_class && (!c.last_visit || now-Date.parse(c.last_visit)>21*864e5);
      case "new": return keyOf(c.created_at).slice(0,7)===monthStart;
    } return true;
  });
  var el=document.getElementById("cTable"); if(!el) return;
  if(!list.length){ el.innerHTML='<div class="empty"><p>'+esc(t("clients.none"))+'</p></div>'; return; }
  el.innerHTML='<table class="tbl cards"><thead><tr><th>'+esc(t("f.name"))+'</th><th class="opt">'+esc(t("clients.pass"))+'</th><th class="num opt">'+esc(t("clients.visits"))+'</th><th class="opt">'+esc(t("clients.last"))+'</th><th class="opt">'+esc(t("clients.next"))+'</th><th class="num">'+esc(t("clients.owes"))+'</th></tr></thead><tbody>'+

        '<td class="opt">'+(c.pass?'<span class="chip">'+esc(c.pass.kind==="pack"?t("tag.passLeft",{n:c.pass.left}):t("tag.unlimited"))+'</span>':'<span class="muted">—</span>')+'</td>'+

        '<td class="opt">'+(c.last_visit?esc(shortDay(keyOf(c.last_visit))):'<span class="muted">—</span>')+'</td>'+
        '<td class="opt">'+(c.next_class?esc(whenLabel(c.next_class)):'<span class="muted">—</span>')+'</td>'+
        '<td class="num">'+(c.unpaid_cents?'<span class="chip bad">'+money(c.unpaid_cents)+'</span>':'<span class="muted">—</span>')+'</td></tr>';
    }).join("")+'</tbody></table>'+(list.length>300?'<p class="tiny muted" style="padding:10px 12px">'+esc(t("clients.more",{n:list.length-300}))+'</p>':'');
}

function openClient(id, keepOpen){
  S.drawerClient=id;
  rpc("admin_client",{ p_id:id }).then(function(d){
    if(S.drawerClient!==id) return;
    var c=d.client, tk=todayKey(), now=Date.now();
    var upcoming=d.bookings.filter(function(b){return Date.parse(b.starts_at)>now && (b.status==="booked"||b.status==="waitlist")}).reverse(),
        past=d.bookings.filter(function(b){return Date.parse(b.starts_at)<=now || b.status==="cancelled"});
    var visits=d.bookings.filter(function(b){return b.status==="attended"}).length, ns=d.bookings.filter(function(b){return b.status==="no_show"}).length;
    var wa=waLink(c.phone, t("wa.generic",{name:c.full_name.split(" ")[0]}));
    var active=d.passes.filter(function(p){return p.status==="active" && p.expires_on>=tk && (p.classes_total==null||p.classes_used<p.classes_total)}),
        others=d.passes.filter(function(p){return active.indexOf(p)<0});
    function passCard(p){
      var exp=p.expires_on<tk, used=p.kind==="pack"?p.classes_used+"/"+p.classes_total:"";
      return '<div class="passcard'+(p.status==="void"||exp?" void":"")+'"><div class="row"><b>'+esc(p.name)+'</b><span>'+(p.paid?'<span class="chip ok">'+esc(t("pay.paidBy",{m:methodLabel(p.payment_method)}))+'</span>':'<span class="chip bad">'+esc(t("pay.unpaidAmt",{a:money(p.price_cents)}))+'</span>')+
        (p.status==="void"?' <span class="chip line">'+esc(t("pass.void"))+'</span>':exp?' <span class="chip line">'+esc(t("pass.expired"))+'</span>':'')+'</span></div>'+
        (p.kind==="pack"?'<div class="meter"><i style="width:'+pct(p.classes_used,p.classes_total)+'%"></i></div><div class="row tiny"><span>'+esc(t("pass.used",{u:used}))+' · '+esc(t("pass.left",{n:p.classes_total-p.classes_used}))+'</span><span>'+esc(t("pass.until",{d:shortDay(p.expires_on)}))+'</span></div>'
          :'<div class="row tiny"><span>'+esc(t("tag.unlimited"))+'</span><span>'+esc(t("pass.until",{d:shortDay(p.expires_on)}))+'</span></div>')+
        '<div class="row"><span></span><button class="btn btn-sm btn-ghost" type="button" data-menu="pass" data-p="'+p.id+'" data-paid="'+p.paid+'" data-st="'+p.status+'">'+I.dots+'</button></div></div>';
    }
    function hist(b){ var st={attended:["ok",t("st.attended")],no_show:["bad",t("st.noShow")],cancelled:["line",t("st.cancelled")],booked:["",t("st.booked")],waitlist:["sun",t("st.waitlist")]}[b.status]||["",b.status];
      return '<div><span><b>'+esc(cname(b))+'</b> <span class="muted tiny">'+esc(whenLabel(b.starts_at))+'</span></span><span><span class="chip '+st[0]+'">'+esc(st[1])+'</span>'+
        (["attended","no_show"].indexOf(b.status)>=0?(b.paid?' <span class="chip '+(b.method==="pack"?"":"ok")+'">'+esc(b.method==="pack"?t("pay.byPass"):methodLabel(b.method))+'</span>':' <span class="chip bad">'+money(b.price_cents)+'</span>'):'')+'</span></div>'; }
    var body=
      '<div class="contact">'+(wa?'<a class="btn btn-sm" target="_blank" rel="noopener" href="'+esc(wa)+'">'+I.wa+'WhatsApp</a>':'')+(c.phone?'<a class="btn btn-sm" href="tel:'+esc(c.phone)+'">'+I.phone+esc(c.phone)+'</a>':'')+(c.email?'<a class="btn btn-sm" href="mailto:'+esc(c.email)+'">'+I.mail+esc(t("f.email"))+'</a>':'')+'</div>'+
      '<div class="kpis" style="margin:0">'+kpi(t("clients.visits"),visits)+kpi(t("st.noShow"),ns)+kpi(t("clients.since"),shortDay(keyOf(c.created_at)))+'</div>'+
      '<div class="section"><h3>'+esc(t("clients.passes"))+'<button class="btn btn-sm btn-olive" type="button" data-sellpass="'+c.id+'">'+I.plus+esc(t("pay.sellPass"))+'</button></h3>'+
        (active.length?'<div style="display:grid;gap:8px">'+active.map(passCard).join("")+'</div>':'<p class="muted" style="margin:0">'+esc(t("clients.noPass"))+'</p>')+
        (others.length?'<details style="margin-top:10px"><summary class="tiny muted" style="cursor:pointer">'+esc(t("clients.oldPasses",{n:others.length}))+'</summary><div style="display:grid;gap:8px;margin-top:8px">'+others.map(passCard).join("")+'</div></details>':'')+
      '</div>'+
      '<div class="section"><h3>'+esc(t("clients.upcoming"))+'<button class="btn btn-sm" type="button" data-bookclient="'+c.id+'">'+I.plus+esc(t("clients.book"))+'</button></h3>'+
        (upcoming.length?'<div class="hist">'+upcoming.map(hist).join("")+'</div>':'<p class="muted" style="margin:0">'+esc(t("clients.noUpcoming"))+'</p>')+'</div>'+
      '<div class="section"><h3>'+esc(t("clients.history"))+'</h3>'+(past.length?'<div class="hist">'+past.slice(0,40).map(hist).join("")+'</div>':'<p class="muted" style="margin:0">'+esc(t("clients.noHistory"))+'</p>')+'</div>'+
      '<div class="section"><h3>'+esc(t("clients.details"))+'</h3>'+clientForm(c)+'<div style="margin-top:12px"><button class="btn btn-olive" type="button" id="cfSave">'+esc(t("save"))+'</button></div></div>';
    if(keepOpen&&drawerIsOpen()){ document.getElementById("drTitle").textContent=c.full_name; document.getElementById("drBody").innerHTML=body; }
    else openDrawer(c.full_name, body, null, function(){ S.drawerClient=null; });
    document.getElementById("cfSave").addEventListener("click",function(e){ var btn=e.currentTarget, f=readClientForm(); busy(btn,true);
      rpc("admin_save_client",{ p_id:c.id, p_full_name:f.name, p_email:f.email, p_phone:f.phone, p_notes:f.notes }).then(function(){ toast(t("toast.saved")); busy(btn,false); openClient(c.id,true); if(S.view==="clients") viewClients(true); }, function(e){ busy(btn,false); fail(e); }); });
  }, fail);
}
function passMenu(anchor,id,paid,status){
  var items=[];
  if(!paid){ items.push({head:t("pay.markPaid")}); ["card","bizum","cash"].forEach(function(m){ items.push({ label:methodLabel(m), icon:I.check, run:function(){ passAction(id,"paid",m); } }); }); }
  else items.push({ label:t("pay.markUnpaid"), icon:I.x, run:function(){ passAction(id,"unpaid"); } });
  items.push("-");
  if(status==="void") items.push({ label:t("pass.restore"), run:function(){ passAction(id,"restore"); } });
  else items.push({ label:t("pass.voidIt"), danger:true, icon:I.x, run:function(){ if(window.confirm(t("confirm.void"))) passAction(id,"void"); } });
  openMenu(anchor,items);
}
function passAction(id,action,method){ rpc("admin_pass_action",{ p_pass_id:id, p_action:action, p_method:method||null }).then(function(){ toast(t("toast.saved")); afterChange(); }, fail); }
function sellPassDrawer(clientId, clientName){
  var prods=S.boot.pass_products.filter(function(p){return p.active});
  var reopen=S.drawerClient; S.drawerClient=null;
  openDrawer(t("pay.sellPass"),
    '<div class="muted">'+esc(clientName||"")+'</div>'+

    '<div class="section" style="display:grid;gap:10px"><div class="lbl">'+esc(t("pay.how"))+'</div><div class="seg" role="group" id="spM">'+["card","bizum","cash","later"].map(function(m,i){ return '<button type="button" data-m="'+m+'" aria-pressed="'+(i===0)+'">'+esc(m==="later"?t("pay.later"):methodLabel(m))+'</button>'; }).join("")+'</div>'+
    '<div class="fld"><label for="spStart">'+esc(t("pass.startsOn"))+'</label><input class="inp" id="spStart" type="date" value="'+todayKey()+'"></div>'+
    '<p class="tiny muted" style="margin:0">'+esc(t("pass.autoHint"))+'</p></div>',
    '<button class="btn btn-ghost" type="button" data-close>'+esc(t("cancel"))+'</button><button class="btn btn-clay" type="button" id="spGo">'+esc(t("pay.sell"))+'</button>', function(){ if(reopen) setTimeout(function(){ if(!drawerIsOpen()) openClient(reopen); },350); });
  var method="card";
  document.getElementById("spM").addEventListener("click",function(e){ var b=e.target.closest("[data-m]"); if(!b) return; method=b.dataset.m; this.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", x===b); }); });
  document.getElementById("spGo").addEventListener("click",function(e){
    var btn=e.currentTarget, sel=document.querySelector('input[name="spP"]:checked'); if(!sel){ toast(t("err.MISSING"),true); return; } busy(btn,true);
    rpc("admin_sell_pass",{ p_client_id:clientId, p_product_id:sel.value, p_paid:method!=="later", p_method:method==="later"?null:method, p_starts_on:document.getElementById("spStart").value||null })
      .then(function(r){ toast(r.applied_to_past_classes?t("toast.passSoldApplied",{n:r.applied_to_past_classes}):t("toast.passSold")); drawerOnClose=null; closeDrawer(); afterChange(); if(reopen) setTimeout(function(){ openClient(clientId); },380); },

function bookClientDrawer(clientId){
  var reopen=S.drawerClient; S.drawerClient=null;
  var from=todayKey();
  Promise.all([rpc("admin_week",{p_from:from}),rpc("admin_week",{p_from:addDays(from,7)})]).then(function(r){
    var list=r[0].concat(r[1]).filter(function(s){return s.status==="scheduled"&&Date.parse(s.starts_at)>Date.now()});
    var byDay={}; list.forEach(function(s){ (byDay[keyOf(s.starts_at)]=byDay[keyOf(s.starts_at)]||[]).push(s); });
    openDrawer(t("clients.book"),
      Object.keys(byDay).sort().map(function(k){ return '<div><div class="subhead" style="margin-left:0">'+esc(relDay(k)||longDay(k))+'</div><div class="section" style="padding:4px 14px">'+byDay[k].map(function(s){
        return '<button type="button" class="list-row" data-bookin="'+s.id+'" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;width:100%;padding:10px 0;border-bottom:1px solid var(--line)"><span><b>'+timeOf(s.starts_at)+'</b> '+esc(cname(s))+' <span class="tiny muted">'+esc(s.instructor||"")+'</span></span><span class="tiny '+(s.booked>=s.capacity?"":"muted")+'">'+s.booked+'/'+s.capacity+(s.booked>=s.capacity?' · '+esc(t("add.overCap")):'')+'</span></button>'; }).join("")+'</div></div>'; }).join(""),
      null, function(){ if(reopen) setTimeout(function(){ if(!drawerIsOpen()) openClient(reopen); },350); });
    document.getElementById("drBody").addEventListener("click",function(e){ var b=e.target.closest("[data-bookin]"); if(!b) return;
      rpc("admin_add_booking",{ p_session_id:b.dataset.bookin, p_client_id:clientId }).then(function(){ toast(t("toast.added")); closeDrawer(); afterChange(); }, fail); });
  }, fail);
}

    var collected=st.collected_classes_cents+st.collected_passes_cents, att=st.attended+st.no_shows, fillP=pct(st.fill.taken,st.fill.capacity);
    var monthLabel=fmtDate(mo,{month:"long",year:"numeric"});
    var slots=st.by_slot.filter(function(x){return x.fill!=null});
    m.innerHTML='<div class="fade-in"><div class="ph"><div><h1 class="serif">'+esc(t("nav.money"))+'</h1><div class="sub" style="text-transform:capitalize">'+esc(monthLabel)+'</div></div>'+
      '<div class="actions"><span class="datenav"><button class="btn btn-icon" type="button" data-monthnav="-1" aria-label="'+esc(t("prev"))+'">'+I.left+'</button><button class="btn btn-sm" type="button" data-monthnav="0">'+esc(t("thisMonth"))+'</button><button class="btn btn-icon" type="button" data-monthnav="1" aria-label="'+esc(t("next"))+'">'+I.right+'</button></span></div></div>'+
      '<div class="kpis">'+

        kpi(t("m.pending"), money(st.pending_cents), t("m.pendingHint",{n:st.unpaid.length+st.unpaid_passes.length}))+
        kpi(t("m.attendance"), pct(st.attended,att)+"%", t("m.attendanceHint",{a:st.attended,n:st.no_shows}))+
        kpi(t("m.fill"), fillP+"%", t("m.fillHint",{n:st.fill.sessions}))+
        kpi(t("m.newClients"), st.new_clients, t("m.trials",{n:st.trials}))+
        kpi(t("m.passesSold"), st.passes_sold, st.late_cancels?t("m.lateCancels",{n:st.late_cancels}):"")+
      '</div>'+
      '<div class="card" style="padding:16px 18px;margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h3 style="margin:0;font-size:15px">'+esc(t("m.chartTitle"))+'</h3><span class="tiny muted">'+esc(t("m.chartHint"))+'</span></div>'+chart(st.by_day)+'</div>'+
      '<div class="cols2">'+
        '<div class="card" style="padding:16px 18px"><h3 style="margin:0 0 8px;font-size:15px">'+esc(t("m.byClass"))+'</h3>'+(st.by_class.length?st.by_class.map(function(c){ return '<div class="hbar"><span>'+esc(cname(c))+' <span class="tiny muted">· '+c.sessions+'</span></span><span class="track"><i style="width:'+(c.fill||0)+'%"></i></span><span class="pct">'+(c.fill||0)+'%</span></div>'; }).join(""):'<p class="muted">'+esc(t("m.noData"))+'</p>')+
          '<h3 style="margin:18px 0 8px;font-size:15px">'+esc(t("m.bestSlots"))+'</h3>'+slotRows(slots.slice(0,4))+
          '<h3 style="margin:18px 0 8px;font-size:15px">'+esc(t("m.worstSlots"))+'</h3>'+slotRows(slots.slice(-4).reverse())+'</div>'+
        '<div class="card" style="padding:16px 18px"><h3 style="margin:0 0 8px;font-size:15px">'+esc(t("m.unpaid"))+'</h3>'+
          (st.unpaid.length||st.unpaid_passes.length ? '<div class="hist">'+

            st.unpaid.map(function(u){ var wa=waLink(u.phone,t("wa.reminder",{name:u.full_name.split(" ")[0],cls:cname(u),when:shortDay(keyOf(u.starts_at)),amt:money(u.price_cents)}));

function slotRows(list){ return list.length ? list.map(function(x){ return '<div class="hbar"><span>'+esc(t("dowShort."+x.weekday))+' '+esc(x.time)+' <span class="tiny muted">'+esc(cname(x))+'</span></span><span class="track"><i style="width:'+x.fill+'%"></i></span><span class="pct">'+x.fill+'%</span></div>'; }).join("") : '<p class="muted tiny">'+esc(t("m.noData"))+'</p>'; }
function chart(days){
  var mainEl=document.getElementById("main"), W=Math.max(300, Math.min(1100, (mainEl?mainEl.clientWidth:700)-(window.innerWidth<700?36:70))), H=200, pad={l:44,r:8,t:10,b:24}, max=Math.max.apply(null,days.map(function(d){return d.cents}).concat([1]));
  var step=Math.pow(10,Math.floor(Math.log10(max/100)))*100, nice=Math.ceil(max/step)*step; if(nice/step>6){ step*=2; nice=Math.ceil(max/step)*step; }
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, bw=iw/days.length, g="", tk=todayKey();
  for(var v=0; v<=nice; v+=step){ var y=pad.t+ih-ih*v/nice; g+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+y+'" y2="'+y+'" stroke="#E2D4BE" stroke-width="1"/><text x="'+(pad.l-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#6B5B4C">'+esc(money(v).replace(/\s/g," "))+'</text>'; }
  days.forEach(function(d,i){
    var h=nice?ih*d.cents/nice:0, x=pad.l+i*bw+1, w=Math.max(2,bw-2), y=pad.t+ih-h, r=Math.min(4,w/2,h);
    var path = h>0 ? 'M'+x+','+(pad.t+ih)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+w-r)+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+' V'+(pad.t+ih)+' Z' : '';
    g+='<g class="cb" data-d="'+d.day+'" data-c="'+d.cents+'" data-a="'+d.attended+'"><rect x="'+(pad.l+i*bw)+'" y="'+pad.t+'" width="'+bw+'" height="'+ih+'" fill="transparent"/>'+(path?'<path d="'+path+'" fill="'+(d.day===tk?"#B5532F":"#56603F")+'"/>':'')+'</g>';
    var dn=+d.day.slice(8); if(dn===1||dn%(W<500?10:5)===0) g+='<text x="'+(pad.l+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="#6B5B4C">'+dn+'</text>';
  });
  return '<div class="chart" id="chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMinYMin meet" role="img" aria-label="'+esc(t("m.chartTitle"))+'">'+g+'</svg><div class="tip" id="chartTip"></div></div>'+
    '<details style="margin-top:8px"><summary class="tiny muted" style="cursor:pointer">'+esc(t("m.table"))+'</summary><table class="tbl" style="margin-top:6px"><thead><tr><th>'+esc(t("f.date"))+'</th><th class="num">'+esc(t("m.collected"))+'</th><th class="num">'+esc(t("st.attended"))+'</th></tr></thead><tbody>'+
    days.filter(function(d){return d.cents||d.attended}).map(function(d){ return '<tr><td>'+esc(shortDay(d.day))+'</td><td class="num">'+money(d.cents)+'</td><td class="num">'+d.attended+'</td></tr>'; }).join("")+'</tbody></table></details>';
}
function bindChart(){
  var c=document.getElementById("chart"), tip=document.getElementById("chartTip"); if(!c) return;
  function showTip(g,ev){ var r=c.getBoundingClientRect(); tip.innerHTML='<b>'+esc(shortDay(g.dataset.d))+'</b> · '+esc(money(+g.dataset.c))+' · '+esc(t("m.tipAttended",{n:g.dataset.a})); tip.style.left=Math.min(Math.max(ev.clientX-r.left,60),r.width-60)+"px"; tip.style.top=(ev.clientY-r.top)+"px"; tip.classList.add("on"); }
  c.addEventListener("mousemove",function(e){ var g=e.target.closest(".cb"); if(g) showTip(g,e); else tip.classList.remove("on"); });
  c.addEventListener("mouseleave",function(){ tip.classList.remove("on"); });
  c.addEventListener("touchstart",function(e){ var g=e.target.closest(".cb"); if(g) showTip(g,e.touches[0]); },{passive:true});
}

function loadMailLog(){
  var box=document.getElementById("mailLog"); if(!box) return;
  rpc("admin_email_log",{ p_limit:40 }).then(function(list){
    box=document.getElementById("mailLog"); if(!box) return;
    if(!list.length){ box.innerHTML='<p class="muted" style="margin:0">'+esc(t("mail.none"))+'</p>'; return; }
    var chip={ sent:"ok", pending:"sun", sending:"sun", failed:"bad", skipped:"line" };
    box.innerHTML='<div class="hist">'+list.map(function(m){
      return '<div><span style="min-width:0"><b>'+esc(t("mail.k."+m.kind))+'</b> <span class="tiny muted">'+esc(m.to_email)+' · '+esc(whenLabel(m.created_at))+'</span>'+(m.last_error?'<div class="tiny" style="color:var(--bad)">'+esc(m.last_error)+'</div>':'')+'</span>'+

    }).join("")+'</div>';
  }, function(e){ box.innerHTML='<p class="tiny" style="color:var(--bad)">'+esc(errMsg(e))+'</p>'; });
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button, a"); if(!b) return;
  var d=b.dataset;
  if(d.lang){ lang=d.lang; LS.set("lang",lang); document.documentElement.lang=lang; closeDrawer(); if(S.boot) renderShell(); else renderLogin(); return; }
  if(d.view){ closeDrawer(); show(d.view); return; }
  if("logout" in d){ closeDrawer(); if(mode!=="demo") Auth.signOut(); LS.del("mode"); mode=null; S.boot=null; renderLogin(); return; }
  if("demoreset" in d){ if(window.confirm(t("demo.resetConfirm"))){ Demo.reset(); boot(); } return; }
  if("retry" in d){ refresh(); return; }
  if("close" in d){ closeDrawer(); return; }
  if("freshok" in d){ Demo.dismissFresh(); viewToday(true); return; }
  if(d.freshgo){ S.day=d.d; S.open={}; S.open[d.freshgo]=true; S._openedFirst=true; viewToday(); return; }
  if(d.daynav!=null){ S.day = d.daynav==="0" ? todayKey() : addDays(S.day,+d.daynav); S.open={}; S._openedFirst=false; viewToday(); return; }
  if(d.toggle){ S.open[d.toggle]=!S.open[d.toggle]; var s=(S.cache.day||[]).filter(function(x){return x.id===d.toggle})[0]; if(s){ var el=document.getElementById("s-"+s.id); el.outerHTML=sessionCard(s); var nb=document.querySelector('[data-toggle="'+s.id+'"]'); if(nb) nb.focus(); } return; }
  if(d.showcanc){ S.open["c-"+d.showcanc]=!S.open["c-"+d.showcanc]; if(S.drawerSession&&S.drawerSession.id===d.showcanc) reloadSessionDrawer(); else viewToday(true); return; }
  if(d.bact){ b.disabled=true; bookingAction(d.b,d.bact); return; }
  if(d.menu==="pay"){ var f=findBooking(d.b); if(f) payMenu(b,f.b); return; }
  if(d.menu==="booking"){ var f2=findBooking(d.b); if(f2) bookingMenu(b,f2.b,f2.s); return; }
  if(d.menu==="pass"){ passMenu(b,d.p,d.paid==="true",d.st); return; }
  if(d.menu==="unpaid"){ var id=d.b, items=[{head:t("pay.markPaid")}];
    ["card","bizum","cash"].forEach(function(mm){ items.push({ label:methodLabel(mm), icon:I.check, run:function(){ bookingAction(id,"paid",mm,t("toast.paid",{m:methodLabel(mm)})); } }); });
    if(d.haspass==="true") items.push({ label:t("pay.usePassShort"), icon:I.ticket, run:function(){ bookingAction(id,"paid","pack",t("toast.passUsed")); } });
    openMenu(b,items); return; }
  if(d.addp){ var sa=(S.drawerSession&&S.drawerSession.id===d.addp)?S.drawerSession:(S.cache.day||[]).filter(function(x){return x.id===d.addp})[0]; if(sa){ var keep=S.drawerSession; S.drawerSession=null; drawerOnClose=null; addPersonDrawer(sa); if(keep) drawerOnClose=function(){ S.drawerSession=keep; setTimeout(function(){ if(!drawerIsOpen()) reloadSessionDrawer(true); },350); }; } return; }
  if(d.allin){ var sx=(S.drawerSession&&S.drawerSession.id===d.allin)?S.drawerSession:(S.cache.day||[]).filter(function(x){return x.id===d.allin})[0]; if(!sx) return;
    var ids=sx.roster.filter(function(r){return r.status==="booked"}).map(function(r){return r.id}); b.disabled=true;
    ids.reduce(function(p,id){ return p.then(function(){ return rpc("admin_booking_action",{ p_booking:id, p_action:"attended" }); }); }, Promise.resolve()).then(function(){ toast(t("toast.allIn",{n:ids.length})); afterChange(); }, function(e){ fail(e); afterChange(); }); return; }
  if(d.editsess){ var se=(S.drawerSession&&S.drawerSession.id===d.editsess)?S.drawerSession:(S.cache.day||[]).filter(function(x){return x.id===d.editsess})[0]; if(se){ S.drawerSession=null; drawerOnClose=null; editSessionDrawer(se); } return; }
  if(d.client){ e.preventDefault(); closeMenu(); var dr=drawerIsOpen(); S.drawerSession=null; drawerOnClose=null; if(dr){ document.getElementById("drawer").classList.remove("open"); } openClient(d.client); return; }
  if(d.wtab){ S.weekTab=d.wtab; viewWeek(); return; }
  if(d.weeknav!=null){ S.weekFrom = d.weeknav==="0" ? mondayOf(todayKey()) : addDays(S.weekFrom,+d.weeknav); viewWeek(); return; }
  if(d.wsess){ openSessionFromWeek(d.wsess); return; }
  if("extra" in d){ extraClassDrawer(); return; }
  if("tpladd" in d){ templateDrawer(); return; }
    if(d.cf){ S.clientFilter=d.cf; document.querySelectorAll("[data-cf]").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.cf===d.cf); }); drawClients(); return; }
  if("newclient" in d){ newClientDrawer(); return; }
  if("csv" in d){ exportClientsCsv(); return; }
  if(d.sellpass){ var nm=document.getElementById("drTitle").textContent; drawerOnClose=null; sellPassDrawer(d.sellpass,nm); return; }
  if(d.bookclient){ drawerOnClose=null; bookClientDrawer(d.bookclient); return; }
  if(d.monthnav!=null){ var mm2=d.monthnav==="0"?todayKey().slice(0,7)+"-01":(function(){ var p=S.month.split("-"); return new Date(Date.UTC(+p[0],+p[1]-1+(+d.monthnav),1)).toISOString().slice(0,10); })(); S.month=mm2; viewMoney(); return; }
  if(d.ctedit!=null){ classTypeDrawer(S.boot.class_types.filter(function(c){return c.id===d.ctedit})[0]); return; }
  if(d.insedit!=null){ instructorDrawer(S.boot.instructors.filter(function(c){return c.id===d.insedit})[0]); return; }
  if("mailtest" in d){ b.disabled=true; rpc("admin_send_test_email",{ p_to:null }).then(function(r){ toast(t("mail.testQueued",{to:r.to})); b.disabled=false; setTimeout(loadMailLog,400); setTimeout(loadMailLog,6000); }, function(e){ b.disabled=false; fail(e); }); return; }
  if("maillog" in d){ loadMailLog(); return; }
  if(d.mailretry){ rpc("admin_retry_email",{ p_id:d.mailretry }).then(function(){ toast(t("toast.saved")); loadMailLog(); }, fail); return; }
  if(d.ppedit!=null){ passProductDrawer(S.boot.pass_products.filter(function(c){return c.id===d.ppedit})[0]); return; }
});

document.addEventListener("keydown",function(e){

  if(e.key==="Tab"&&drawerIsOpen()){ var d=document.getElementById("drawer"), f=[].slice.call(d.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]')).filter(function(x){return x.offsetParent!==null}); if(!f.length) return;

});

/* a booking made on the website (another tab) shows up here without reloading */
window.addEventListener("storage",function(e){ if(mode==="demo"&&S.boot&&e.key&&e.key.indexOf(SITE_PREFIX)===0&&Demo.sync&&Demo.sync()){ if(!drawerIsOpen()&&!menuEl) refresh(); } });
setInterval(function(){ if(S.boot&&!document.hidden&&!drawerIsOpen()&&!menuEl&&S.view==="today") viewToday(true); }, 60000);

start();
})();
